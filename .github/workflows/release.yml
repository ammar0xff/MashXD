name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for the release (e.g. 1.1.0). Uses the pushed tag when empty.'
        required: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  pyinstaller:
    name: pyinstaller (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: MashXD-windows-x86_64
            ext: .exe
          - os: ubuntu-latest
            asset: MashXD-linux-x86_64
            ext: ''
          - os: macos-latest
            asset: MashXD-darwin-arm64
            ext: ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller
      - name: Build one-file binary
        run: pyinstaller --onefile --clean --name MashXD MashXD.py
      - name: Smoke-test the binary
        run: python tools/smoke_binary.py
      - name: Package Windows zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/MashXD.exe, README.md, samples/Mal-Hashes.txt `
            -DestinationPath "${{ matrix.asset }}.zip"
      - name: Package macOS zip
        if: runner.os == 'macOS'
        run: |
          mkdir -p "bundle/${{ matrix.asset }}"
          cp dist/MashXD "bundle/${{ matrix.asset }}/MashXD"
          cp README.md samples/Mal-Hashes.txt "bundle/${{ matrix.asset }}/"
          (cd bundle && zip -r "../${{ matrix.asset }}.zip" "${{ matrix.asset }}")
      - name: Upload artifact (${{ matrix.os }})
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}.zip
            dist/MashXD${{ matrix.ext }}
          if-no-files-found: error

  package-linux:
    name: package .deb + AppImage
    needs: pyinstaller
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch Linux binary
        uses: actions/download-artifact@v4
        with:
          name: MashXD-linux-x86_64
          path: ./bin
      - name: Compute version
        id: ver
        shell: bash
        run: |
          V="${VERSION#v}"
          echo "value=${V}" >> "$GITHUB_OUTPUT"
          echo "version=${V}" >> "$GITHUB_ENV"
      - name: Build .deb package
        run: |
          chmod +x bin/MashXD
          mkdir -p pkg/DEBIAN pkg/usr/bin pkg/usr/share/applications \
                   pkg/usr/share/icons/hicolor/256x256/apps
          cp bin/MashXD pkg/usr/bin/MashXD
          cp packaging/MashXD.desktop pkg/usr/share/applications/
          cp packaging/mashxd.png pkg/usr/share/icons/hicolor/256x256/apps/
          cat > pkg/DEBIAN/control <<EOF
          Package: mashxd
          Version: ${VERSION#v}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: ammar0xff <ammar0xff@users.noreply.github.com>
          Description: Malware triage engine based on hash-list comparison
           In-memory only. Recursive zip/rar walking, type sniffing, entropy,
           indicator strings and optional pefile PE analysis with weighted
           scoring. Requires 'unrar' for .rar containers.
          EOF
          dpkg-deb --build --root-owner-group pkg "MashXD_${VERSION#v}_amd64.deb"
      - name: Build AppImage
        run: |
          set -e
          curl -fsSLo appimagetool.AppImage \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
          ./appimagetool.AppImage --appimage-extract >/dev/null
          mv squashfs-root appimagetool
          mkdir -p appdir/usr/bin
          cp bin/MashXD appdir/usr/bin/MashXD
          cp packaging/AppRun appdir/AppRun
          chmod +x appdir/AppRun
          cp packaging/MashXD.desktop appdir/
          cp packaging/mashxd.png appdir/mashxd.png
          ARCH=x86_64 VERSION="${VERSION#v}" \
            ./appimagetool/AppRun --no-appstream appdir "MashXD-${VERSION#v}-x86_64.AppImage"
      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: MashXD-deb
          path: MashXD_*.deb
      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: MashXD-AppImage
          path: MashXD-*.AppImage

  release:
    name: publish GitHub Release
    needs: [pyinstaller, package-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Collect all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: List assets
        run: ls -la release-assets
      - name: Create/update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version && format('v{0}', github.event.inputs.version) || github.ref_name }}
          name: MashXD ${{ github.event.inputs.version && format('v{0}', github.event.inputs.version) || github.ref_name }}
          body: |
            ## MashXD release

            Prebuilt binaries for Windows, Linux and macOS.

            | file | use |
            |------|-----|
            | `MashXD-windows-x86_64.zip` | Windows 64-bit: packaged `MashXD.exe` |
            | `MashXD-<version>-x86_64.AppImage` | Linux 64-bit: AppImage |
            | `MashXD_<version>_amd64.deb` | Debian/Ubuntu: `sudo apt install ./MashXD_*_amd64.deb` |
            | `MashXD-linux-x86_64` | Linux 64-bit: plain PyInstaller binary |
            | `MashXD-darwin-arm64.zip` | macOS (Apple Silicon): packaged binary |

            ### Notes
            * `.rar` containers need the `unrar` binary (e.g. `sudo apt install unrar`).
            * Everything scans in memory - nothing is extracted to disk.
            * `--json`, `--html report.html`, and `-f <dir>` are supported.
            * Malware samples shipped here are harmless hashes/lab exercises.
          generate_release_notes: false
          files: release-assets/*
          draft: false
          prerelease: false